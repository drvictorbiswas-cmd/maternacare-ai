# Fly.io config — run `fly launch --no-deploy` then `fly deploy`.
app = "maternacare-ai"
primary_region = "sin"   # Singapore, closest to India

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

# Persistent volume so SQLite data survives redeploys:
#   fly volumes create maternacare_data --region sin --size 1
#   then uncomment the mount below:
# [[mounts]]
#   source = "maternacare_data"
#   destination = "/app/data"
