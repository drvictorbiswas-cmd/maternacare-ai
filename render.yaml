# Render.com Blueprint — connect this repo and Render auto-detects this file.
# Free tier available (spins down when idle). See DEPLOY.md.
services:
  - type: web
    name: maternacare-ai
    runtime: docker
    plan: free
    region: singapore          # closest to India users
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
